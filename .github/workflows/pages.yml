# Builds the browser version of the game and publishes it with GitHub Pages.
# Runs on every push to main (and from the Actions tab). One-time setup: in the
# repository's Settings > Pages, set "Source" to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      # SDL3 and SDL3_image take a few minutes to build; keep them between runs
      - uses: actions/cache@v4
        with:
          path: .web-deps
          key: web-deps-${{ runner.os }}-emsdk-6.0.10-${{ hashFiles('scripts/build-web.sh') }}

      - name: Build the game for the browser
        run: bash scripts/build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
